<!-- resources/components/button.html -->
<button type="button" class="px-5 py-2.5 rounded-full font-medium text-xs font-mono transition-all duration-150 inline-flex items-center justify-center gap-2 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white active:scale-98 {{ classes }}">
  <i class="{{ icon }} text-xs" aria-hidden="true"></i>
  <span>{{ text }}</span>
  <span class="empty:hidden">{{ slot }}</span>
</button>
