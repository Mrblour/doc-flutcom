<!-- resources/components/feature-card.html -->
<div class="p-6 rounded-2xl border border-white/10 bg-zinc-950/60 backdrop-blur-md flex flex-col h-full group hover:border-white/20 transition-colors">
  <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white mb-4 group-hover:border-white/25 transition-colors">
    <i class="{{ icon }} text-lg" aria-hidden="true"></i>
  </div>
  <h3 class="text-white text-base font-semibold mb-2 tracking-tight">{{ title }}</h3>
  <p class="text-zinc-400 text-xs sm:text-sm leading-relaxed mb-4 flex-1">{{ description }}</p>
  <div class="text-zinc-500 text-xs font-mono empty:hidden">{{ slot }}</div>
</div>
