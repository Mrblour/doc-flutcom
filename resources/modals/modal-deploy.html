<div class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/85 backdrop-blur-xl" data-modal-overlay>
  <div class="modal-container w-full max-w-md bg-[#09090b] border border-white/10 rounded-[32px] overflow-hidden shadow-[0_0_80px_-20px_rgba(139,92,246,0.3)] reveal reveal-up relative">
    
    <!-- Metallic Purple Glow -->
    <div class="absolute -top-32 -left-32 w-64 h-64 bg-purple-600/15 blur-[100px] rounded-full pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-64 h-64 bg-white/5 blur-[100px] rounded-full pointer-events-none"></div>

    <!-- Close button -->
    <button data-modal-close class="absolute top-6 right-6 w-9 h-9 flex items-center justify-center rounded-full bg-white/5 border border-white/10 text-zinc-400 hover:text-white hover:bg-white/10 hover:border-white/20 transition-all z-20">
      <i class="bi bi-x-lg text-xs"></i>
    </button>

    <div class="relative z-10">
      <!-- Silver line -->
      <div class="h-px w-full bg-gradient-to-r from-transparent via-zinc-400 to-transparent opacity-30"></div>

      <div class="p-10 text-center">
        <!-- Metallic Icon -->
        <div class="relative w-20 h-20 mx-auto mb-8">
          <div class="absolute inset-0 bg-purple-500/20 rounded-3xl blur-2xl"></div>
          <div class="relative w-full h-full rounded-[24px] bg-gradient-to-b from-zinc-800 to-black border border-white/20 flex items-center justify-center shadow-2xl">
            <i class="bi bi-terminal-fill text-3xl text-zinc-100 drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]"></i>
          </div>
        </div>

        <h2 class="text-3xl font-black text-white mb-3 tracking-tight">Deployment <span class="text-zinc-400">Hub</span></h2>
        <p class="text-zinc-500 text-sm leading-relaxed mb-8 px-2 font-medium">
          Zero-dependency architecture. Ready for <span class="text-purple-400">Vercel</span>, <span class="text-purple-400">Netlify</span> and <span class="text-purple-400">S3</span>.
        </p>

        <!-- Silver Terminal -->
        <div class="bg-zinc-900/40 rounded-3xl border border-white/5 p-1 mb-8 backdrop-blur-sm">
          <div class="flex items-center gap-1.5 px-5 py-3.5 border-b border-white/5">
            <div class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
            <div class="w-2.5 h-2.5 rounded-full bg-purple-500/50"></div>
            <span class="ml-2 text-[9px] font-bold font-mono text-zinc-600 uppercase tracking-[0.2em]">repository.sh</span>
          </div>
          <div class="p-6 flex items-center justify-between group">
            <code class="text-zinc-200 font-mono text-sm tracking-tight truncate mr-4">npm create flutcom@latest</code>
            <button data-copy="npm create flutcom@latest" 
              class="flex-shrink-0 w-10 h-10 rounded-xl bg-white text-black hover:bg-purple-500 hover:text-white transition-all flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:shadow-[0_0_20px_rgba(139,92,246,0.4)]">
              <i class="bi bi-clipboard-fill"></i>
            </button>
          </div>
        </div>

        <button data-modal-close class="text-zinc-600 hover:text-zinc-400 text-[10px] font-black uppercase tracking-[0.3em] transition-colors">
          Dismiss Dashboard
        </button>
      </div>
    </div>
  </div>
</div>
