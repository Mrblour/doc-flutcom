<!-- resources/components/alert.html -->
<div class="p-5 rounded-2xl border border-white/10 bg-zinc-950/60 backdrop-blur-md flex items-start gap-4 transition-colors hover:border-white/20 group">
  <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white flex-shrink-0 group-hover:border-white/25 transition-colors">
    <i class="{{ icon }} text-base" aria-hidden="true"></i>
  </div>
  <div class="flex-1 min-w-0">
    <h4 class="text-white text-sm font-semibold mb-1 tracking-tight">{{ title }}</h4>
    <p class="text-zinc-400 text-xs sm:text-sm leading-relaxed">{{ description }}</p>
    <div class="mt-2 text-zinc-300 text-xs font-mono empty:hidden">{{ slot }}</div>
  </div>
</div>
