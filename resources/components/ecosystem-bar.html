<!-- resources/components/ecosystem-bar.html -->
<section id="ecosystem-bar-root" class="relative border-y border-white/[0.08] py-8 bg-black/60 backdrop-blur-md overflow-hidden select-none" aria-label="Ecosistema de Despliegue Estático">

  <!-- Ambient Halftone Spheres Dual Traversing Background -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Esfera 1: Inicia en la izquierda y viaja hacia la derecha -->
    <div id="halftone-sphere-1" class="absolute top-1/2 left-0 w-60 h-60 sm:w-72 sm:h-72 pointer-events-none will-change-transform" style="transform: translate(-100px, -50%); opacity: 0.22;">
      <img src="assets/img/halftone-sphere.svg" alt="" class="w-full h-full object-contain filter drop-shadow-[0_0_35px_rgba(255,255,255,0.18)]" aria-hidden="true" />
    </div>

    <!-- Esfera 2: Inicia en la derecha y viaja hacia la izquierda (cruce dinámico) -->
    <div id="halftone-sphere-2" class="absolute top-1/2 left-0 w-60 h-60 sm:w-72 sm:h-72 pointer-events-none will-change-transform" style="transform: translate(-100px, -50%); opacity: 0.22;">
      <img src="assets/img/halftone-sphere.svg" alt="" class="w-full h-full object-contain filter drop-shadow-[0_0_35px_rgba(255,255,255,0.18)]" aria-hidden="true" />
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-6 relative z-10 flex flex-wrap items-center justify-around gap-8 sm:gap-12 opacity-80 hover:opacity-100 transition-opacity duration-300">
    <!-- Vercel -->
    <div class="flex items-center gap-2.5 text-zinc-300 hover:text-white font-semibold tracking-wide text-sm transition-all duration-300 hover:scale-105 cursor-default group">
      <svg class="w-4 h-4 fill-zinc-300 group-hover:fill-white group-hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.7)] transition-all" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M24 22.525H0l12-21.05 12 21.05z"/>
      </svg>
      <span>Vercel</span>
    </div>

    <!-- GitHub Pages -->
    <div class="flex items-center gap-2.5 text-zinc-300 hover:text-white font-semibold tracking-wide text-sm transition-all duration-300 hover:scale-105 cursor-default group">
      <i class="bi bi-github text-base text-zinc-400 group-hover:text-white group-hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.7)] transition-all" aria-hidden="true"></i>
      <span>GitHub Pages</span>
    </div>

    <!-- Netlify -->
    <div class="flex items-center gap-2.5 text-zinc-300 hover:text-white font-semibold tracking-wide text-sm transition-all duration-300 hover:scale-105 cursor-default group">
      <i class="bi bi-clouds text-base text-zinc-400 group-hover:text-white group-hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.7)] transition-all" aria-hidden="true"></i>
      <span>Netlify</span>
    </div>

    <!-- Cloudflare Pages -->
    <div class="flex items-center gap-2.5 text-zinc-300 hover:text-white font-semibold tracking-wide text-sm transition-all duration-300 hover:scale-105 cursor-default group">
      <i class="bi bi-cloud-check text-base text-zinc-400 group-hover:text-white group-hover:drop-shadow-[0_0_8px_rgba(255,255,255,0.7)] transition-all" aria-hidden="true"></i>
      <span>Cloudflare Pages</span>
    </div>

    <!-- Zero Runtime / Flutcom Version Badge -->
    <div class="flex items-center gap-2 text-zinc-300 font-mono text-xs uppercase tracking-widest bg-white/[0.04] border border-white/10 hover:border-white/20 px-3.5 py-1.5 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.04)] transition-all duration-300 hover:scale-105">
      <span class="w-2 h-2 rounded-full bg-white shadow-[0_0_8px_rgba(255,255,255,0.8)] animate-pulse"></span>
      <span>Flutcom {{ version }} · 0 KB Runtime</span>
    </div>
  </div>

  <!-- Inline Script procesado nativamente por _executeScripts() de Flutcom -->
  <script>
    (function initEcosystemMotion() {
      const s1 = document.getElementById('halftone-sphere-1');
      const s2 = document.getElementById('halftone-sphere-2');
      const container = document.getElementById('ecosystem-bar-root');
      if (!s1 || !s2 || !container) return;

      const animeLib = window.anime;
      const getWidth = () => container.offsetWidth || window.innerWidth;

      // Movimiento continuo lento y sincronizado que llega completamente hasta el borde derecho
      if (animeLib && typeof animeLib.animate === 'function') {
        const totalW = getWidth();
        const minX = -100;
        const maxX = totalW + 60; // Pasa el límite derecho completamente

        // Esfera 1: Izquierda -> Derecha -> Izquierda
        animeLib.animate(s1, {
          translateX: [
            { to: minX, duration: 0 },
            { to: maxX, duration: 13000, ease: 'linear' },
            { to: minX, duration: 13000, ease: 'linear' }
          ],
          rotate: [
            { to: 0, duration: 0 },
            { to: 360, duration: 26000, ease: 'linear' }
          ],
          loop: true
        });

        // Esfera 2: Derecha -> Izquierda -> Derecha
        animeLib.animate(s2, {
          translateX: [
            { to: maxX, duration: 0 },
            { to: minX, duration: 13000, ease: 'linear' },
            { to: maxX, duration: 13000, ease: 'linear' }
          ],
          rotate: [
            { to: 360, duration: 0 },
            { to: 0, duration: 26000, ease: 'linear' }
          ],
          loop: true
        });
      } else {
        // Fallback constante a 60 FPS sin pausas
        let pos1 = -100;
        let pos2 = (container.offsetWidth || window.innerWidth) + 60;
        let dir1 = 1;
        let dir2 = -1;
        const speed = 1.0;

        function animateBoth() {
          if (!document.contains(s1)) return;
          const max = (container.offsetWidth || window.innerWidth) + 60;
          const min = -100;

          pos1 += speed * dir1;
          if (pos1 >= max) { pos1 = max; dir1 = -1; }
          else if (pos1 <= min) { pos1 = min; dir1 = 1; }

          pos2 += speed * dir2;
          if (pos2 <= min) { pos2 = min; dir2 = 1; }
          else if (pos2 >= max) { pos2 = max; dir2 = -1; }

          s1.style.transform = `translate(${pos1}px, -50%) rotate(${pos1 * 0.25}deg)`;
          s2.style.transform = `translate(${pos2}px, -50%) rotate(${pos2 * -0.25}deg)`;
          requestAnimationFrame(animateBoth);
        }
        requestAnimationFrame(animateBoth);
      }
    })();
  </script>
</section>
