<!-- resources/components/card.html -->
<div data-spotlight class="vercel-card p-8 flex flex-col h-full group">
  <!-- Icon Container -->
  <div class="relative w-12 h-12 rounded-xl bg-white/[0.04] border border-white/10 flex items-center justify-center mb-6 group-hover:border-white/25 group-hover:bg-white/[0.08] transition-[background-color,border-color] duration-200">
    <i class="{{ icono }} text-xl text-zinc-400 group-hover:text-white transition-colors duration-200" aria-hidden="true"></i>
  </div>
  
  <h3 class="text-lg font-bold text-white mb-2 tracking-tight">{{ titulo }}</h3>
  <p class="text-sm text-zinc-400 leading-relaxed mb-6 flex-1 group-hover:text-zinc-300 transition-colors duration-200">{{ descripcion }}</p>
  
  <!-- Link -->
  <a href="{{ enlace }}" class="mt-auto inline-flex items-center gap-2 text-xs font-semibold text-zinc-400 group-hover:text-white transition-colors duration-200 no-underline w-fit focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white rounded py-1">
    <span>{{ botonTexto }}</span>
    <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-white/5 group-hover:bg-white/10 group-hover:translate-x-1 transition-transform duration-200">
      <i class="bi bi-chevron-right text-[10px]" aria-hidden="true"></i>
    </span>
  </a>
</div>
