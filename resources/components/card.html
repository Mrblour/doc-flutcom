<!-- resources/components/card.html -->
<div class="group relative p-[1px] rounded-3xl bg-gradient-to-b from-white/10 to-transparent hover:from-white/20 hover:to-transparent transition-colors duration-500 overflow-hidden h-full">
  <!-- Glowing background effect on hover -->
  <div class="absolute -inset-2 bg-gradient-to-r from-white/0 via-white/5 to-white/0 opacity-0 group-hover:opacity-100 blur-xl transition-opacity duration-700 pointer-events-none"></div>
  
  <div class="relative h-full bg-[#0a0a0a] rounded-[23px] p-8 flex flex-col border border-white/5 group-hover:border-zinc-600 transition-colors duration-500 z-10">
    
    <!-- Icon Container -->
    <div class="relative w-12 h-12 rounded-2xl bg-zinc-900 border border-white/5 flex items-center justify-center mb-6 group-hover:bg-zinc-800 group-hover:border-zinc-600 transition-all duration-500">
      <!-- Outer spin ring -->
      <div class="absolute inset-[-4px] border border-zinc-600/20 rounded-2xl scale-90 opacity-0 group-hover:scale-100 group-hover:opacity-100 transition-all duration-500"></div>
      <i class="{{ icono }} text-xl text-zinc-500 group-hover:text-white transition-all duration-500"></i>
    </div>
    
    <h3 class="text-lg font-bold text-white mb-3 tracking-tight">{{ titulo }}</h3>
    
    <p class="text-sm text-zinc-400 leading-relaxed mb-8 flex-1 group-hover:text-zinc-300 transition-colors">{{ descripcion }}</p>
    
    <!-- Button / Link -->
    <a href="{{ enlace }}" class="mt-auto inline-flex items-center gap-2 text-xs font-bold font-mono tracking-widest uppercase text-zinc-500 group-hover:text-white transition-colors duration-300 no-underline w-fit">
      {{ botonTexto }}
      <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-white/5 group-hover:bg-white/10 group-hover:translate-x-1 transition-all duration-300">
        <i class="bi bi-arrow-right"></i>
      </span>
    </a>
    
    <!-- Top-right tech corner accent -->
    <div class="absolute top-0 right-0 w-16 h-16 pointer-events-none overflow-hidden rounded-tr-[23px]">
      <div class="absolute top-0 right-0 w-[1px] h-8 bg-gradient-to-b from-white/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100"></div>
      <div class="absolute top-0 right-0 h-[1px] w-8 bg-gradient-to-l from-white/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 delay-100"></div>
    </div>
  </div>
</div>
