<header class="fc-header">
  <div class="fc-header-inner">

    <!-- Logo & Brand -->
    <a href="#home" data-view="home" class="fc-logo">
      <img src="assets/img/flutcom.svg" alt="Flutcom" style="width:28px;height:28px;opacity:.9;">
      <span style="font-weight:600;font-size:1.1rem;letter-spacing:-0.02em;">Flutcom</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="fc-nav-desktop">
      <a href="#home"       data-view="home"       class="fc-nav-link">Overview</a>
      <a href="#about"      data-view="about"      class="fc-nav-link">Features</a>
      <a href="#customers"  data-view="customers"  class="fc-nav-link fc-nav-amber"><i class="bi bi-activity"></i> Analytics</a>
      <a href="#sponsors"   data-view="sponsors"   class="fc-nav-link">Sponsors</a>
      <a href="#components" data-view="components" class="fc-nav-link">Components</a>
      <a href="#docs"       data-view="docs"       class="fc-nav-link">Documentation</a>
      <a href="#plugins"    data-view="plugins"    class="fc-nav-link">Plugins</a>
    </nav>

    <!-- Right Actions -->
    <div class="fc-header-actions">
      <span class="fc-version-badge" style="cursor:help;">v<span data-fc-slot="version">1.0.0</span> Stable</span>

      <a href="https://github.com/Mrblour/Flutcom" target="_blank" class="fc-github-link">
        <i class="bi bi-github" style="font-size:1.1rem;"></i>
      </a>

      <div class="fc-divider"></div>

      <!-- Install button con Liquid Glass -->
      <glass-element
        onclick="window.flutcomModals && window.flutcomModals.open('modal-deploy')"
        style="cursor:pointer; --glass-padding: 0; z-index:10;"
        width="90" height="34" radius="99" depth="5" blur="1"
        strength="40" background-color="rgba(255,255,255,0.22)" chromatic-aberration="2">
        <span style="display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:700;padding:0 14px;white-space:nowrap;">
          <i class="bi bi-terminal"></i> Install
        </span>
      </glass-element>

      <!-- Hamburger Mobile -->
      <glass-element
        data-mobile-toggle
        class="fc-hamburger"
        style="cursor:pointer; --glass-padding:0; z-index:10;"
        width="36" height="36" radius="10" depth="4" blur="1"
        strength="35" background-color="rgba(255,255,255,0.12)" chromatic-aberration="1">
        <span style="color:#aaa;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;">
          <i class="bi bi-list"></i>
        </span>
      </glass-element>
    </div>

  </div>

  <!-- Mobile Navigation Dropdown -->
  <nav data-mobile-menu hidden class="fc-mobile-menu">
    <a href="#home"       data-view="home"       class="fc-mobile-link">Overview</a>
    <a href="#about"      data-view="about"      class="fc-mobile-link">Features</a>
    <a href="#customers"  data-view="customers"  class="fc-mobile-link fc-nav-amber"><i class="bi bi-activity"></i> Analytics</a>
    <a href="#components" data-view="components" class="fc-mobile-link">Components</a>
    <a href="#docs"       data-view="docs"       class="fc-mobile-link">Documentation</a>
    <a href="#plugins"    data-view="plugins"    class="fc-mobile-link">Plugins</a>

    <div style="height:1px;background:rgba(255,255,255,0.06);margin:8px 0;"></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="https://github.com/Mrblour/Flutcom" target="_blank" style="color:#888;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;">
        <i class="bi bi-github" style="font-size:1rem;"></i> GitHub
      </a>
      <span style="padding:2px 10px;border-radius:99px;border:1px solid #27272a;background:#000;font-size:10px;font-weight:700;color:#71717a;text-transform:uppercase;letter-spacing:.1em;">v1.0.0</span>
    </div>
  </nav>

</header>
